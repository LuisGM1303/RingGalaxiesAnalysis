[project]
name = "ringgalaxiesanalysis"
version = "0.1.0"
description = ""
authors = [
    {name = "Luis Angel Garcia Mata",email = "garciamataluisangel@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14.1 || >3.14.1,<3.15"
dependencies = [
    "numpy (>=2.4.4,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "requests (>=2.34.1,<3.0.0)",
    "astropy (>=7.2.0,<8.0.0)",
    "tabulate (>=0.10.0,<0.11.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "pywavelets (>=1.9.0,<2.0.0)",
    "torch (>=2.5.0,<2.12.0)",
    "torchvision (>=0.20.0,<0.27.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "grad-cam (>=1.5.5,<2.0.0)"
]

[tool.poetry]
packages = [
  { include = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
