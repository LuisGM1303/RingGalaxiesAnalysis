[tool.poetry]
name = "ringgalaxiesanalysis"
version = "0.1.0"
description = ""
authors = ["Luis Angel Garcia Mata <garciamataluisangel@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

# ── Ciencia de datos ──────────────────────────────────────────────────────────
numpy            = ">=2.4.4,<3.0.0"
pandas           = ">=3.0.3,<4.0.0"
matplotlib       = ">=3.10.9,<4.0.0"
scipy            = ">=1.17.1,<2.0.0"
scikit-image     = ">=0.26.0,<0.27.0"
scikit-learn     = ">=1.8.0,<2.0.0"
pywavelets       = ">=1.9.0,<2.0.0"
seaborn          = ">=0.13.2,<0.14.0"
tabulate         = ">=0.10.0,<0.11.0"
tqdm             = ">=4.67.3,<5.0.0"

# ── Red / HTTP ────────────────────────────────────────────────────────────────
requests         = ">=2.34.1,<3.0.0"
aiohttp          = ">=3.13.5,<4.0.0"

# ── Astronomía ────────────────────────────────────────────────────────────────
astropy          = ">=7.2.0,<8.0.0"

# ── Deep Learning — PyTorch cu128 (driver NVIDIA 570+, CUDA 12.8) ─────────────
torch            = {version = ">=2.7.0,<2.12.0", source = "pytorch-cu128"}
torchvision      = {version = ">=0.22.0,<0.27.0", source = "pytorch-cu128"}
torchaudio       = {version = ">=2.7.0,<2.12.0", source = "pytorch-cu128"}

# ── Deep Learning — herramientas ──────────────────────────────────────────────
grad-cam         = ">=1.5.5,<2.0.0"
timm             = ">=1.0.27,<2.0.0"
huggingface-hub  = ">=1.17.0,<2.0.0"

# ── Astronomía / Zoobot (sin extra [pytorch] para evitar conflicto de fuentes) ─
zoobot          = ">=2.9.0,<3.0.0"   # torch/torchvision/torchaudio ya declarados arriba
torchmetrics    = ">=1.0.0,<2.0.0"   # dep de zoobot[pytorch]
lightning       = ">=2.2.5,<3.0.0"   # dep de zoobot[pytorch]
litmodels       = ">=0.1.0,<1.0.0"   # dep de zoobot[pytorch]

[tool.poetry.group.dev.dependencies]
ipykernel = ">=7.2.0,<8.0.0"

# ── Fuente PyTorch con CUDA 12.8 ──────────────────────────────────────────────
[[tool.poetry.source]]
name     = "pytorch-cu128"
url      = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires      = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"